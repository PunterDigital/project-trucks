[package]
name = "projecttrucks"
version = "0.12.0"
description = "ProjectTrucks - a local ETS2 delivery tracker"
authors = ["Shay Punter <shay@shaypunter.co.uk>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projecttrucks_lib"
# Desktop only: no `staticlib` / `cdylib` (Tauri's template adds them for Android/iOS builds).
# They were linked on every build and never used (#5670).
crate-type = ["rlib"]

[features]
# The E2E test hooks (CDP port, telemetry replay, fake update feed and Hub, dry-run installs,
# the save-dialog stand-in). On in debug builds anyway; release builds have them only with this
# feature, which CI's E2E build and `pnpm tauri build --no-bundle --features e2e` turn on.
# Released installers (release.yml) are built without it (#5614).
e2e = []

# Smaller installers (every one-click update downloads one), #5670. Measured on v0.12.0's code:
# codegen-units = 1 + strip took the exe from 19.9 to 17.2 MB and the NSIS installer from 5.01
# to 4.66 MB. LTO did worse here: fat LTO + 1 codegen unit gave 17.6 / 4.82 MB and made every
# release build several minutes slower, thin LTO made both bigger than no profile at all.
# No `panic = "abort"`: a panic in one tokio task (telemetry, Hub sync) must not take the app down.
[profile.release]
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
tauri-plugin-dialog = "2"
semver = "1"
# One-click updates: the GitHub release check and the installer download. Windows' own TLS
# (schannel) through native-tls; reqwest's default rustls needs aws-lc-rs to build.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "system-proxy"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
